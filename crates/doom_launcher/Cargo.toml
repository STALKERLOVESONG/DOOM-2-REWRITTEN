[package]
name = "doom_launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pick your IWAD and mods, then start doom_bevy"

[[bin]]
name = "doom_launcher"
path = "src/main.rs"

[dependencies]
# Immediate-mode GUI (window, widgets) and native file dialogs. Only the
# launcher uses these; the engine crates stay dependency-free.
eframe = "0.31"
rfd = "0.15"
