[package]
name = "doom_audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Doom audio: DMX sound effects, MUS music on an emulated OPL (Nuked OPL3 port), and a software mixer"

[dependencies]
# Ogg Vorbis, FLAC and MP3 decoding for mod sounds (pure Rust, MPL-2.0).
symphonia = { version = "0.5.4", default-features = false, features = ["ogg", "vorbis", "flac", "mp3"] }

[dev-dependencies]
doom_content.workspace = true
